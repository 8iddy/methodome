name: Integration checks

on:
  push:
    branches:
      - integration
      - main
  pull_request:
    branches:
      - integration
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install workspace dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy-production.sh
          node --check scripts/e2e-smoke.mjs
          node --check scripts/e2e-conversation.mjs

      - name: Backend TypeScript
        run: npm run typecheck

      - name: Backend tests
        run: npm test

      - name: Apply D1 migrations locally
        run: npm run d1:migrate:local

      - name: Bundle Worker
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Python statistics tests
        run: |
          python -m pip install -e services/stats-worker pytest
          pytest services/stats-worker/tests -q

      - name: Package Python Worker
        run: |
          python -m pip install uv
          cd services/stats-worker
          uv sync --group dev
          uv run --group dev pywrangler deploy --dry-run --config wrangler.jsonc

      - name: Install frontend deployment dependencies locally
        run: npm --prefix apps/web install --workspaces=false

      - name: Frontend TypeScript
        run: npm run web:typecheck

      - name: Build frontend
        run: npm run web:build

      - name: Package frontend for Cloudflare
        run: npm --workspace @methodome/web run build:cloudflare
