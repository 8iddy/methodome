name: Backend checks

on:
  push:
    branches:
      - backend-foundation
  pull_request:
    paths:
      - "packages/**"
      - "migrations/**"
      - "tests/**"
      - "spec/**"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migration locally
        run: npm run d1:migrate:local

      - name: Bundle Worker
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
